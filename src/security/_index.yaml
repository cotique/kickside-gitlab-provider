version: "1.0"
namespace: cotique.gitlab_provider.security

# Module-owned access policy for the gitlab-provider endpoints. The grant travels with
# the module; the role group that receives it is injected by the
# user_security_scope requirement, keeping the module app-agnostic.

entries:
  # cotique.gitlab_provider.security:gitlab_provider_endpoint_access
  - name: gitlab_provider_endpoint_access
    kind: security.policy
    meta:
      comment: Authenticated users may reach the gitlab-provider product endpoints.
    groups: []
    policy:
      resources:
        - cotique.gitlab_provider.api:*
      actions: access
      effect: allow

  # cotique.gitlab_provider.security:user_security_scope
  - name: user_security_scope
    kind: ns.requirement
    meta:
      comment: Application security group that may reach the gitlab-provider endpoints.
    targets:
      - entry: cotique.gitlab_provider.security:gitlab_provider_endpoint_access
        path: ".groups +="
