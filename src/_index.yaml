version: "1.0"
namespace: cotique.gitlab_provider

entries:
  # cotique.gitlab_provider:definition
  - name: definition
    kind: ns.definition
    meta:
      title: GitLab Connector
      description: Read-only GitLab connector — a personal/project access token connection provider plus a merge-request pull source for Kickside Data Sync. Never creates, updates, merges, comments on, approves, or labels anything.

  # ─── Dependencies ──────────────────────────────────────────────────────
  # cotique.gitlab_provider:dep.kickside.contract
  - version: "*"
    name: dep.kickside.contract
    kind: ns.dependency
    meta:
      comment: Base kickside.contract:component / :deletable contract definitions the connection binding implements.
    component: kickside/contract

  # cotique.gitlab_provider:dep.kickside.connection
  - version: "*"
    name: dep.kickside.connection
    kind: ns.dependency
    meta:
      comment: kickside.connection:connection contract definition and the base_connection get_status/delete boilerplate library.
    component: kickside/connection

  # cotique.gitlab_provider:dep.kickside.component
  - version: "*"
    name: dep.kickside.component
    kind: ns.dependency
    meta:
      comment: kickside.component:component client library — component.open / component.get_private_context used to read connection credentials.
    component: kickside/component

  # cotique.gitlab_provider:dep.kickside.core
  # NOTE: kickside.data:pullable / kickside.data:writable are exact registry
  # ids confirmed by `wippy registry show kickside.data:pullable --json` per
  # the shared build brief (2026-09-02). Which installed package actually
  # DECLARES them was independently re-verified for this checkout instead of
  # assumed — see BUILD-NOTES.md "Dependency that owns kickside.data:pullable".
  - version: "*"
    name: dep.kickside.core
    kind: ns.dependency
    meta:
      comment: Owns the kickside.data:pullable contract definition implemented by the merge-request pull source (verified — see BUILD-NOTES.md).
    component: kickside/core

  # ─── Dependency interface (ns.requirement) ────────────────────────────
  - name: api_router
    kind: ns.requirement
    meta:
      comment: HTTP router the gitlab-provider status endpoint attaches to. Must enforce auth + endpoint_firewall.
    default: app:api
    targets:
      - entry: cotique.gitlab_provider.api:get_status.endpoint
        path: .meta.router

  - name: ui_server
    kind: ns.requirement
    meta:
      comment: HTTP server the gitlab-provider UI bundle is served from.
    default: app:gateway
    targets:
      - entry: cotique.gitlab_provider:ui_static
        path: .meta.server

  # ─── UI (the gitlab-provider page as a Wippy web component) ──────────────────
  # The module BUILDS (ui/), SHIPS (static/), and SERVES (its own http.static)
  # the page, exposed as a view.component the host mounts by tag. Kept from
  # the template scaffold with minimal changes (see BUILD-NOTES.md) — this
  # task is backend-only in scope.
  - name: ui_fs
    kind: fs.directory
    meta:
      comment: Built gitlab-provider web component bundle (from ui/).
    directory: ./static
    auto_init: true

  - name: ui_static
    kind: http.static
    meta:
      comment: Serves the gitlab-provider web component bundle at /cotique-gitlab-provider.
      server: app:gateway
    path: /cotique-gitlab-provider
    fs: cotique.gitlab_provider:ui_fs
    options:
      mime_types:
        .js: application/javascript
        .css: text/css
        .map: application/json

  - name: gitlab_provider_view
    kind: registry.entry
    meta:
      type: view.component
      title: GitLab Connector
      announced: true
      auto_register: true
      tag_name: cotique-gitlab-provider
      base_path: cotique-gitlab-provider
      entry_point: index.js
      icon: tabler:brand-gitlab
      description: Renders the cotique/gitlab-provider status view inside the Kickside shell, loads authenticated status data through the host proxy, and requires no caller-supplied props.
      props: {}

  - name: nav_item
    kind: registry.entry
    meta:
      type: ui.nav_item
      section: ""
      path: /gitlab-provider
      route_name: gitlab-provider
      title: GitLab Connector
      comment: GitLab connection provider and merge-request pull source status.
      icon: tabler:brand-gitlab
      order: 90
      render: component
      component_tag: cotique-gitlab-provider
