version: "1.0"
namespace: cotique.gitlab.connection

entries:
  # cotique.gitlab.connection:connection_lib
  - name: connection_lib
    kind: library.lua
    meta:
      comment: Shared connection helper — resolves component_id from ambient context and builds a configured GitLab API client for it.
    source: file://connection_lib.lua
    modules:
      - ctx
    imports:
      transport: cotique.gitlab.client:transport

  # cotique.gitlab.connection:get_status
  - name: get_status
    kind: function.lua
    meta:
      comment: kickside.connection:connection.get_status — delegates to the platform's base_connection boilerplate (component read-model, not a live probe). See file header for the base_connection export-shape caveat.
    source: file://get_status.lua
    modules: []
    imports:
      base_connection: kickside.connection:base_connection
    method: get_status

  # cotique.gitlab.connection:delete
  - name: delete
    kind: function.lua
    meta:
      comment: kickside.contract:deletable.delete — delegates to the platform's base_connection boilerplate. See file header for the base_connection export-shape caveat.
    source: file://delete.lua
    modules: []
    imports:
      base_connection: kickside.connection:base_connection
    method: delete

  # cotique.gitlab.connection:test_connection
  - name: test_connection
    kind: function.lua
    meta:
      comment: kickside.connection:connection.test_connection — GET /user proves the token is valid.
    source: file://test_connection.lua
    modules: []
    imports:
      connection_lib: cotique.gitlab.connection:connection_lib
    method: test_connection

  # cotique.gitlab.connection:discover_resources
  - name: discover_resources
    kind: function.lua
    meta:
      comment: kickside.connection:connection.discover_resources — lists accessible GitLab projects, normalized to {id,label,icon,parent_id,selectable,drillable}.
    source: file://discover_resources.lua
    modules: []
    imports:
      connection_lib: cotique.gitlab.connection:connection_lib
      api: cotique.gitlab.client:api
    method: discover_resources

  # cotique.gitlab.connection:gitlab_connection
  # The canonical credential-only binding shape, per
  # docs/kickside-development/04-connections-and-integrations.md's "Minimal
  # Provider Example".
  - name: gitlab_connection
    kind: contract.binding
    meta:
      title: GitLab
      icon: tabler:brand-gitlab
      provider: gitlab
      group: Developer
      class:
        - connection
      # Same token field serves both the read-only pull source (see
      # eng-metrics SPEC.md decision B0) and the v2 write-access agent
      # traits (src/traits/) — no separate credential field or scope
      # selector for write, per the shared build brief: the module never
      # checks or enforces scope up front, a write call against a
      # read_api-scoped token simply fails with a real 403 from GitLab,
      # mapped through the existing data_error permission_denied taxonomy.
      # The help text below asks for the broadest scope a caller might need
      # (api, for write) while noting read_api is enough when only the
      # read-only reader trait / pull source will ever be used.
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: token
            label: Personal or project access token
            type: password
            required: true
            placeholder: glpat-...
            help: "Create a token (User Settings > Access Tokens, or Project Settings > Access Tokens for a project-scoped token). The read_api scope is enough for read-only use (pulling merge requests, the GitLab Reader trait). Creating or updating merge requests and notes (the GitLab Writer/Manager traits) needs the broader api scope instead."
          - key: base_url
            label: GitLab instance URL
            type: text
            required: false
            placeholder: https://gitlab.com
            help: "Leave blank for gitlab.com. Set this for a self-managed GitLab instance, e.g. https://gitlab.example.com."
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: cotique.gitlab.connection:get_status
      - contract: kickside.connection:connection
        context_required: [component_id]
        methods:
          get_status: cotique.gitlab.connection:get_status
          test_connection: cotique.gitlab.connection:test_connection
          discover_resources: cotique.gitlab.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: cotique.gitlab.connection:delete
