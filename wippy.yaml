organization: cotique
module: gitlab-provider
description: Read-only GitLab connector — personal/project access token connection provider (test_connection, discover_resources) and a merge-request pull source for Kickside Data Sync.
# Pick the license your distribution requires (kickside platform modules use BUSL-1.1).
license: MIT
repository: https://github.com/cotique/kickside-gitlab-provider
homepage: https://wippy.ai
keywords:
  - kickside
  - gitlab-provider
embed:
  - cotique.gitlab_provider:ui_fs
exclude_meta:
  type:
    - test
exclude:
  - "wippy.lock"
  - "app:**"
  - "app.env:**"
  - "ui/node_modules/**"
  - "ui/node_modules:**"
  - "ui/coverage/**"
  - "ui/coverage:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
