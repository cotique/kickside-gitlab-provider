name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not "latest": v0.3.35a has a confirmed regression where `wippy
  # test` fails to resolve a workspace-replaced module's own cross-package
  # entry references ("node with ID {cotique.gitlab.source pull_core ...}
  # not found"), even though `wippy update`/`wippy lint` resolve the exact
  # same graph fine on the same version. Isolated directly: identical
  # checkout, identical lock — passes on v0.3.33a, fails on v0.3.35a. See
  # BUILD-NOTES.md for the full repro. Bump back to "latest" once a fixed
  # release is out; re-pin (or bisect with an exact tag) if this recurs.
  WIPPY_VERSION: v0.3.33a

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cotique_test_gitlab
          POSTGRES_USER: kickside
          POSTGRES_PASSWORD: kickside
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kickside -d cotique_test_gitlab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No ui/ (no npm project) in this backend-only module — see
      # BUILD-NOTES.md "removed the template's status-page UI/api/security
      # apparatus". Node itself is still needed to run
      # scripts/check-module.mjs / scripts/test-initializer.mjs, but there's
      # nothing left to npm-cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install verified Wippy CLI
        shell: bash
        run: |
          set -euo pipefail
          if [ "${WIPPY_VERSION}" = "latest" ]; then
            base="https://github.com/wippyai/runtime/releases/latest/download"
          else
            base="https://github.com/wippyai/runtime/releases/download/${WIPPY_VERSION}"
          fi
          curl -fsSLO "${base}/wippy-linux-amd64"
          curl -fsSLO "${base}/SHA256SUMS"
          grep ' wippy-linux-amd64$' SHA256SUMS | sha256sum -c -
          sudo install -m 0755 wippy-linux-amd64 /usr/local/bin/wippy
          wippy version

      - name: Verify SQLite, registry, and frontend
        run: make verify

      - name: Verify PostgreSQL
        run: make test-pg

      - name: Generated artifacts are reproducible
        run: git diff --exit-code
